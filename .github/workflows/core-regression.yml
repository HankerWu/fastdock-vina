name: Core docking regression
on:
  push:
    branches: [fastdock-vina-pro]
    paths:
      - 'src/**'
      - 'tools/build.py'
      - 'benchmarks/check_map_lattice.cpp'
      - 'benchmarks/ad4_atom_field/check_field.cpp'
      - 'benchmarks/ad4_atom_field/check_release_cli.py'
      - 'benchmarks/check_late_pose_geometry.cpp'
      - 'benchmarks/check_online_pose_archive.cpp'
      - 'benchmarks/archive_overlap/output_spacing/check.cpp'
      - 'benchmarks/check_macrocycle_labels.cpp'
      - 'benchmarks/terminal_rotor_score/independent/axis_check.cpp'
      - 'benchmarks/terminal_rotor_score/independent/verify.py'
      - 'benchmarks/bond_distance/**'
      - 'benchmarks/macrocycle_proposal/**'
      - 'benchmarks/fixtures/cyclododecane.pdbqt'
      - 'benchmarks/check_geometry_metric.cpp'
      - 'benchmarks/check_armijo_numeric.cpp'
      - '.github/workflows/core-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lattice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-system-dev libboost-thread-dev libboost-serialization-dev libboost-filesystem-dev libboost-program-options-dev
      - name: Build current engine
        run: python3 tools/build.py --output-dir build/core --jobs 2
      - name: Test online pose separation and tie ordering
        run: |
          c++ -O2 -DNDEBUG -std=c++14 -Isrc/lib benchmarks/check_online_pose_archive.cpp build/core/obj/coords.o -o build/core/check-online-archive
          build/core/check-online-archive
      - name: Test final pose spacing across energy windows and output APIs
        run: |
          tar -xf benchmarks/pair_gradient/galectin_external/raw.tar.xz -C "${RUNNER_TEMP}" prepared/3T1L.pdbqt prepared/10.pdbqt
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib benchmarks/archive_overlap/output_spacing/check.cpp $(find build/core/obj -name '*.o' ! -name main.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/check-output-spacing
          build/core/check-output-spacing "${RUNNER_TEMP}/prepared/3T1L.pdbqt" "${RUNNER_TEMP}/prepared/10.pdbqt"
      - name: Test force-field-specific grid membership and chemical pose geometry
        run: |
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib benchmarks/check_late_pose_geometry.cpp $(find build/core/obj -name '*.o' ! -name main.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/check-grid-domain
          build/core/check-grid-domain
      - name: Test imported map lattices
        run: |
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib benchmarks/check_map_lattice.cpp $(find build/core/obj -name '*.o' ! -name main.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/check-map-lattice
          build/core/check-map-lattice "${RUNNER_TEMP}/map-lattice-fixtures"
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib benchmarks/ad4_atom_field/check_field.cpp $(find build/core/obj -name '*.o' ! -name main.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/check-ad4-field
          build/core/check-ad4-field "${RUNNER_TEMP}/charged-field" benchmarks/fixtures/flex-rigid.pdbqt benchmarks/fixtures/flex-residue.pdbqt
          python3 benchmarks/ad4_atom_field/check_release_cli.py build/core/vina
      - name: Test strict Armijo and geometry preconditioner
        run: |
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib benchmarks/check_armijo_numeric.cpp $(find build/core/obj -name '*.o' ! -name main.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/check-armijo
          build/core/check-armijo
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib benchmarks/check_geometry_metric.cpp $(find build/core/obj -name '*.o' ! -name main.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/check-geometry
          build/core/check-geometry examples/basic/1iep_ligand.pdbqt benchmarks/fixtures/cyclododecane.pdbqt
      - name: Test two-sided ligand rotor counting
        run: |
          audit=benchmarks/terminal_rotor_score/independent
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib "$audit/axis_check.cpp" $(find build/core/obj -name '*.o' ! -name main.o ! -name split.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/check-two-sided-rotors
          python3 -S "$audit/verify.py" build/core/check-two-sided-rotors "${RUNNER_TEMP}/two-sided-rotors" --synthetic-only
      - name: Test cyclic ligand bond-distance exclusions and gradients
        run: |
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib benchmarks/bond_distance/audit.cpp $(find build/core/obj -name '*.o' ! -name main.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/bond-distance
          python3 benchmarks/bond_distance/root_order.py build/core/bond-distance --require-valid
      - name: Test macrocycle label invariance
        run: |
          c++ -O2 -DNDEBUG -std=c++14 -pthread -Isrc/lib benchmarks/check_macrocycle_labels.cpp $(find build/core/obj -name '*.o' ! -name main.o) -lboost_system -lboost_thread -lboost_serialization -lboost_filesystem -lboost_program_options -o build/core/check-labels
          build/core/check-labels examples/basic/1iep_receptor.pdbqt benchmarks/fixtures/cyclododecane.pdbqt
      - name: Reproduce archived pose and affinity aggregation
        run: python3 benchmarks/search_budget/replay.py
      - name: Verify macrocycle research records
        run: python3 benchmarks/macrocycle_proposal/verify.py
      - name: Package tested binary
        run: |
          mkdir -p build/core/dist/lib
          cp build/core/vina build/core/dist/
          ldd build/core/vina | awk '/libboost_.* => / {print $3}' | while read -r library; do cp -L "$library" build/core/dist/lib/; done
          git rev-parse HEAD > build/core/dist/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: core-docking-binary
          path: build/core/dist
